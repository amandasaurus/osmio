[package]
name = "osmio"
version = "0.15.0-rc1"
authors = ["Amanda McCann <amanda@technomancy.org>"]
keywords = ["openstreetmap", "osm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amandasaurus/osmio/"
description = "Read and write OpenStreetMap data files"
edition = "2021"

[dependencies]
anyhow = "1.0"
byteorder = "1.3.2"
bzip2 = "0.4"
chrono = "0.4.31"
derive_builder = "0.20"
flate2 = "1.0.12"
iter-progress = "0.8.0"
protobuf = { version = "~2.8.1", features = ["with-bytes"] }
quick-xml = "0.33"
separator = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13.2"
smol_str = "0.3.1"
xml-rs = "0.8.0"

rusqlite = { version = "0.32", optional = true }

[features]
with-changeset-sqlite = [ "dep:rusqlite" ]

[[bin]]
name = "osmio-changeset-tags-to-sqlite"
required-features = [ "with-changeset-sqlite" ]
